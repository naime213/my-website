<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — الصفحة غير موجودة | عبد المنعم بركاتي</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Bebas+Neue&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --white: #F5F5F0;
      --gray: #9A9A9A;
      --bg: #0A0A0A;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 40px 24px;
    }

    /* Film grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .wrap { position: relative; z-index: 1; max-width: 600px; width: 100%; }

    /* Film strip top decoration */
    .film-strip {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 48px;
      opacity: 0.3;
    }
    .film-hole {
      width: 14px;
      height: 10px;
      border: 1px solid var(--gold);
      border-radius: 2px;
    }

    /* 404 number */
    .num-404 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(7rem, 22vw, 14rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201,168,76,0.35);
      position: relative;
      user-select: none;
    }
    .num-404::after {
      content: '404';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(201,168,76,0.06);
      -webkit-text-stroke: 0;
      font-size: inherit;
      filter: blur(20px);
    }

    /* Scene label */
    .scene-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    /* Title */
    .title-ar {
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      font-weight: 700;
      color: var(--white);
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .title-en {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: rgba(245,245,240,0.35);
      letter-spacing: 0.08em;
      margin-bottom: 32px;
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 32px;
    }

    /* Description */
    .desc {
      font-size: 0.95rem;
      color: rgba(245,245,240,0.45);
      line-height: 1.9;
      max-width: 400px;
      margin: 0 auto 48px;
    }

    /* Button */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold);
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      padding: 14px 32px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .btn-home:hover {
      background: rgba(201,168,76,0.08);
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .btn-home svg { width: 16px; height: 16px; transition: transform 0.3s; }
    .btn-home:hover svg { transform: translateX(-4px); }

    /* Bottom film strip */
    .film-strip-btm { margin-top: 56px; }

    /* Clapper icon */
    .clapper {
      font-size: 2.5rem;
      margin-bottom: 16px;
      opacity: 0.15;
      line-height: 1;
    }

    @media (max-width: 480px) {
      .film-hole { width: 10px; height: 7px; }
      .desc { font-size: 0.88rem; }
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0T9Q0EGF7C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-0T9Q0EGF7C");
  </script>
</head>
<body>
  <div class="wrap">

    <div class="film-strip">
      <div class="film-hole"></div><div class="film-hole"></div>
      <div class="film-hole"></div><div class="film-hole"></div>
      <div class="film-hole"></div><div class="film-hole"></div>
      <div class="film-hole"></div><div class="film-hole"></div>
    </div>

    <div class="clapper">🎬</div>

    <div class="num-404">404</div>

    <p class="scene-label">SCENE NOT FOUND</p>

    <h1 class="title-ar">المشهد لم يُعثر عليه</h1>
    <p class="title-en">The frame you're looking for has been cut from the reel.</p>

    <div class="divider"></div>

    <p class="desc">
      يبدو أن هذه الصفحة لا توجد أو تم حذفها.<br>
      عُد إلى الصفحة الرئيسية لاستكشاف الأعمال.
    </p>

    <a href="/" class="btn-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      العودة إلى الرئيسية
    </a>

    <div class="film-strip film-strip-btm">
      <div class="film-hole"></div><div class="film-hole"></div>
      <div class="film-hole"></div><div class="film-hole"></div>
      <div class="film-hole"></div><div class="film-hole"></div>
      <div class="film-hole"></div><div class="film-hole"></div>
    </div>

  </div>
</body>
</html>
